<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prisma · Commercial Portfolio Pilot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%237b6cff'/><path d='M16 6l8 10-8 10-8-10z' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
  <style>
:root {
  --bg0: #050821; --bg1: #0a1040; --bg2: #101a5c; --line: rgba(140, 160, 255, .16); --line2: rgba(140, 160, 255, .28);
  --glass: rgba(20, 30, 95, .55); --glass2: rgba(28, 40, 120, .55); --txt: #eef1ff; --mut: #9aa6d8; --mut2: #6f7bb0;
  --vi: #7b6cff; --bl: #4fc3ff; --gr: #2fe07a; --ye: #ffc23a; --re: #ff3b3b; --or: #ff8a2a;
  --r: 16px; --side: 78px; --panel: 380px;
  font-family: 'Inter', system-ui, sans-serif; color: var(--txt); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg0); overflow: hidden; }
body { background: radial-gradient(1200px 700px at 70% -10%, #1b2a9a55, transparent), radial-gradient(900px 600px at 0% 100%, #3a1fa033, transparent), linear-gradient(160deg, #060a2a, #0b1350 60%, #0a0f3a); }
h1, h2, h3, .h { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; margin: 0; letter-spacing: -.02em; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--bl); }
.mut { color: var(--mut); } .mut2 { color: var(--mut2); } .sm { font-size: 12px; } .xs { font-size: 11px; }
.ok { color: var(--gr); } .warn { color: var(--ye); } .bad { color: var(--re); }
.row { display: flex; align-items: center; gap: 10px; } .col { display: flex; flex-direction: column; gap: 10px; }
.sp { flex: 1; } .wrap { flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; } .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.eyebrow { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); font-weight: 700; }

/* ---------------- app shell */
#app { display: grid; grid-template-columns: var(--side) 1fr; height: 100vh; }
.sidebar { background: linear-gradient(180deg, #0a1250, #070c36); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 12px 0 10px; gap: 4px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; z-index: 5; }
.sidebar::-webkit-scrollbar { display: none; }
.logo { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(145deg, #a99dff, #5b4bff 60%, #3a2bb8); display: grid; place-items: center; box-shadow: 0 8px 24px -6px #6a5bff, inset 0 1px 0 #fff6; font-size: 20px; }
.logo-t { font-size: 9.5px; font-weight: 800; letter-spacing: .14em; margin: 4px 0 6px; color: #c9c3ff; }
.nav-sec { font-size: 8.5px; font-weight: 800; letter-spacing: .12em; color: #8f86ff; margin: 10px 0 2px; text-transform: uppercase; }
.nav-item { width: 62px; padding: 7px 2px 6px; border: 0; border-radius: 12px; background: transparent; color: #b9c2ee; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 600; cursor: pointer; --fx-depth: 0px; }
.nav-item .ic { font-size: 17px; line-height: 1; filter: saturate(.2) brightness(1.4); }
.nav-item.on { background: linear-gradient(180deg, #4a3ee0, #3527b5); color: #fff; --fx-depth: 3px; --fx-edge: #20166e; }
.nav-item.on .ic { filter: none; }
.nav-item .badge, .bell .badge { position: absolute; top: 2px; right: 9px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: #6d5cff; color: #fff; font-size: 9.5px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 10px #6d5cff; }
.bell { position: relative; flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; background: rgba(255, 255, 255, .06); cursor: pointer; font-size: 17px; margin-bottom: 4px; }
.bell .badge { background: var(--re); box-shadow: 0 0 10px var(--re); right: -4px; top: -4px; }

main { position: relative; overflow: hidden; }
.view { position: absolute; inset: 0; overflow: auto; padding: 26px 30px 60px; display: none; }
.view.on { display: block; }
.view.espelho { padding: 0; overflow: hidden; }
.page-h { margin-bottom: 18px; }
.page-h h1 { font-size: 30px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.page-h h1 em { font-style: normal; color: #8fb2ff; font-weight: 700; }
.page-h .sub { color: var(--mut); font-size: 13px; margin-top: 4px; }

/* ---------------- botões base (pele 3D vem do fx.css) */
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255, 255, 255, .08); color: #fff; white-space: nowrap; }
.btn-sm { padding: 7px 11px; font-size: 12px; border-radius: 10px; }
.btn-block { width: 100%; }
.chip { border: 0; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; background: rgba(255, 255, 255, .06); color: #cfd6ff; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: linear-gradient(180deg, #6a5cff, #4b3cdc); color: #fff; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(8, 12, 50, .72); border: 1px solid var(--line2); backdrop-filter: blur(10px); }
.seg > button { border: 0; border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; background: transparent; color: #cfd6ff; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; --fx-depth: 0px; }
.seg > button.on { background: linear-gradient(180deg, #8d80ff, #5b4bff); color: #fff; --fx-depth: 3px; --fx-edge: #2e2290; }
.seg.green > button.on { background: linear-gradient(180deg, #4ff09a, #18b860); color: #04230f; --fx-edge: #0b6a36; }
.icon-btn { border: 0; width: 34px; height: 34px; border-radius: 10px; background: rgba(255, 255, 255, .07); cursor: pointer; display: grid; place-items: center; font-size: 15px; }
input.inp, select.inp, textarea.inp { width: 100%; background: rgba(5, 9, 40, .7); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; outline: none; }
input.inp:focus, select.inp:focus, textarea.inp:focus { border-color: var(--vi); box-shadow: 0 0 0 3px #7b6cff33; }
label.fl { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--mut); font-weight: 600; }

/* ---------------- cards */
.card { background: linear-gradient(180deg, rgba(36, 50, 150, .42), rgba(18, 26, 90, .5)); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; position: relative; box-shadow: 0 20px 40px -24px #000, inset 0 1px 0 #ffffff12; }
.card h3 { font-size: 15px; font-weight: 800; }
.kpi { background: linear-gradient(180deg, rgba(40, 56, 170, .5), rgba(20, 28, 100, .5)); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; position: relative; }
.kpi .v { font-size: 24px; font-weight: 800; font-family: 'Plus Jakarta Sans'; margin-top: 4px; }
.kpi .ic { font-size: 20px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; background: rgba(255, 255, 255, .08); }
.pill.g { background: #2fe07a22; color: #6dffa8; border: 1px solid #2fe07a66; } .pill.y { background: #ffc23a22; color: #ffd36e; border: 1px solid #ffc23a66; }
.pill.r { background: #ff3b3b22; color: #ff8080; border: 1px solid #ff3b3b66; } .pill.b { background: #4fc3ff22; color: #8fdcff; border: 1px solid #4fc3ff66; } .pill.v { background: #7b6cff33; color: #c8c0ff; border: 1px solid #7b6cff77; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: linear-gradient(145deg, #6e60ff, #3a7bff); flex: none; }
.bar { height: 8px; border-radius: 9px; background: rgba(255, 255, 255, .08); overflow: hidden; } .bar > i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #6a5cff, #4fc3ff); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.empty { text-align: center; color: var(--mut); padding: 30px 10px; font-size: 13px; }

/* ---------------- espelho 3D */
.esp { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr var(--panel); }
.stage { position: relative; overflow: hidden; background: #02040f; }
.bld-canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; cursor: grab; }
.stage-top { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 10px; align-items: flex-start; z-index: 3; pointer-events: none; }
.stage-top > * { pointer-events: auto; }
.stage-top .stack { display: flex; flex-direction: column; gap: 8px; }
.planta-sel { margin-left: auto; background: rgba(8, 12, 50, .78); border: 1px solid var(--line2); border-radius: 12px; padding: 9px 12px; font-weight: 700; font-size: 12.5px; backdrop-filter: blur(10px); min-width: 230px; }
.toolbar { position: absolute; right: 14px; top: 50%; translate: 0 -50%; display: flex; flex-direction: column; gap: 9px; z-index: 3; }
.tool { width: 40px; height: 40px; border: 0; border-radius: 12px; background: rgba(12, 18, 70, .85); color: #dfe4ff; cursor: pointer; display: grid; place-items: center; font-size: 16px; backdrop-filter: blur(8px); }
.tool.on { background: linear-gradient(180deg, #5a6bff, #3a4be0); color: #fff; }
.viewbar { position: absolute; left: 14px; top: 50%; translate: 0 -50%; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 7px; border-radius: 16px; background: rgba(8, 12, 40, .72); border: 1px solid var(--line2); backdrop-filter: blur(10px); z-index: 3; }
.vbtn { width: 40px; height: 40px; border: 0; border-radius: 11px; background: transparent; color: #cfd6ff; display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s, box-shadow .15s, transform .12s; }
.vbtn:hover { background: rgba(255, 255, 255, .1); color: #fff; }
.vbtn:active { transform: translateY(1px) scale(.96); }
.vbtn.on { background: linear-gradient(180deg, #17b7c9, #0a8fa6); color: #fff; box-shadow: 0 0 0 2px #2fe9ff, 0 0 16px #2fe9ff99; }
.vsep { width: 26px; height: 1px; background: var(--line2); margin: 3px 0; }
.vzoom { font-size: 10.5px; font-weight: 700; color: #cfd6ff; min-height: 14px; }
.legend { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 8px; z-index: 3; flex-wrap: wrap; }
.legend .chip { background: rgba(8, 12, 50, .8); backdrop-filter: blur(8px); }
.legend .chip.on { background: linear-gradient(180deg, #6a5cff, #4b3cdc); }
.credit { position: absolute; right: 14px; bottom: 8px; font-size: 10px; color: #8a93c8aa; z-index: 2; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: rgba(6, 10, 40, .92); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 11px; font-size: 12px; min-width: 170px; backdrop-filter: blur(8px); box-shadow: 0 10px 30px #0008; display: none; }
.tip b { font-size: 13px; }
.sel-label { position: absolute; left: 0; top: 0; z-index: 3; padding: 3px 9px; border-radius: 8px; background: #fff; color: #111; font-size: 12px; font-weight: 800; pointer-events: none; box-shadow: 0 4px 14px #0007; }
.marker-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.bld-marker { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; border-radius: 999px; padding: 3px 7px; font-size: 11px; font-weight: 800; color: #fff; background: rgba(10, 16, 60, .9); box-shadow: 0 0 0 2px #4fc3ff, 0 6px 16px #0008; cursor: pointer; white-space: nowrap; }
.bld-marker.ch { box-shadow: 0 0 0 2px var(--or), 0 6px 16px #0008; } .bld-marker.fin { box-shadow: 0 0 0 2px var(--re), 0 6px 16px #0008; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 4; background: radial-gradient(circle, #0d1660, #02040f); transition: opacity .6s; }
.loading.hide { opacity: 0; pointer-events: none; }
.loading .spin { width: 46px; height: 46px; border-radius: 50%; border: 3px solid #ffffff22; border-top-color: var(--vi); animation: sp 1s linear infinite; margin: 0 auto 12px; }
@keyframes sp { to { rotate: 360deg; } }

.panel { background: linear-gradient(180deg, #0d1654, #0a1146); border-left: 1px solid var(--line); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.panel-scroll { overflow: auto; padding: 18px 18px 40px; flex: 1; }
.panel h2 { font-size: 24px; font-weight: 800; }
.back { background: none; border: 0; color: #b9c2ff; font-size: 12.5px; cursor: pointer; padding: 0; margin-bottom: 8px; }
.back:hover { color: #fff; }
.mirror { display: grid; grid-template-columns: 22px repeat(4, 1fr); gap: 4px; }
.mirror .fl { font-size: 10px; color: var(--mut); display: grid; place-items: center; font-weight: 700; }
.mirror button { border: 0; border-radius: 6px; height: 22px; font-size: 10.5px; font-weight: 800; color: #0b0f22; cursor: pointer; transition: transform .15s, filter .15s, box-shadow .15s; box-shadow: inset 0 -2px 0 #0003, 0 2px 0 #0006; }
.mirror button:hover { transform: translateY(-2px) scale(1.06); filter: brightness(1.15); }
.mirror button.sel { outline: 2px solid #fff; outline-offset: 1px; }
.mirror button.dim { opacity: .25; }
.st-disponivel { background: #2fe07a; } .st-reservado { background: #ffc23a; } .st-vendido { background: #ff4a4a; color: #fff !important; } .st-bloqueado { background: #8a93b8; }
.stackbar { display: flex; height: 7px; border-radius: 9px; overflow: hidden; gap: 2px; }
.price { font-size: 30px; font-weight: 800; font-family: 'Plus Jakarta Sans'; background: linear-gradient(90deg, #a99dff, #6fb8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.thumb { border-radius: 14px; background: #0b1137; border: 1px solid var(--line); overflow: hidden; position: relative; cursor: zoom-in; }
.thumb img { display: block; width: 100%; aspect-ratio: 640/520; object-fit: cover; }
.thumb .btn { position: absolute; right: 10px; bottom: 10px; }
.spec { background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.spec .eyebrow { font-size: 9px; } .spec b { font-size: 16px; }

/* CRM morador */
.crm-card { background: linear-gradient(160deg, #3b2fd6aa, #1d2a9a99); border: 1px solid #8f86ff55; border-radius: 18px; padding: 14px; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat3 > div { background: rgba(5, 8, 40, .45); border-radius: 12px; padding: 9px; font-size: 11px; cursor: pointer; border: 1px solid transparent; }
.stat3 > div:hover { border-color: var(--line2); }
.stat3 b { display: block; font-size: 20px; font-family: 'Plus Jakarta Sans'; }
.sec { margin-top: 14px; background: linear-gradient(180deg, rgba(40, 52, 170, .45), rgba(20, 28, 110, .45)); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.sec-h { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13.5px; margin-bottom: 10px; }
.enc { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(5, 8, 40, .4); margin-bottom: 8px; }
.enc img { width: 74px; height: 58px; object-fit: cover; border-radius: 9px; }
.enc-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; background: rgba(0, 0, 0, .25); border-radius: 9px; padding: 7px; font-size: 10.5px; grid-column: 1 / -1; }
.enc-meta b { display: block; font-size: 12px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); position: relative; margin: 10px 0 4px; font-size: 10.5px; }
.steps::before { content: ''; position: absolute; left: 8px; right: 8px; top: 6px; height: 2px; background: #ffffff22; }
.steps > div { position: relative; padding-top: 18px; color: var(--mut); }
.steps > div::before { content: ''; position: absolute; top: 0; left: 0; width: 14px; height: 14px; border-radius: 50%; background: #2a3270; border: 2px solid #4a55a0; }
.steps > div.done { color: #fff; } .steps > div.done::before { background: var(--ye); border-color: #fff; box-shadow: 0 0 10px var(--ye); }
.steps > div:nth-child(2) { text-align: center; } .steps > div:nth-child(2)::before { left: 50%; translate: -50% 0; }
.steps > div:nth-child(3) { text-align: right; } .steps > div:nth-child(3)::before { left: auto; right: 0; }
.bill { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 11px; background: rgba(5, 8, 40, .4); margin-bottom: 6px; font-size: 12.5px; }
.tl { position: relative; padding-left: 18px; }
.tl::before { content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: #ffffff1c; }
.tl > div { position: relative; padding: 4px 0 10px; font-size: 12.5px; }
.tl > div::before { content: ''; position: absolute; left: -16px; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--vi); box-shadow: 0 0 8px var(--vi); }
.person { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid #ffffff10; font-size: 12.5px; }
.person:last-child { border-bottom: 0; }

/* ---------------- dashboard */
.chart { display: flex; align-items: flex-end; gap: 14px; height: 210px; padding: 20px 6px 0; }
.chart .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; cursor: pointer; }
.chart .b i { width: 60%; max-width: 44px; border-radius: 10px 10px 4px 4px; background: linear-gradient(180deg, #d8d2ff, #7b6cff 60%, #4a3cd0); box-shadow: 0 0 22px #7b6cff88, inset 0 1px 0 #fff; transition: height .9s cubic-bezier(.2, .8, .2, 1), filter .2s; min-height: 3px; }
.chart .b:hover i { filter: brightness(1.25); }
.chart .b span { font-size: 11px; color: var(--mut); font-weight: 700; }
.chart .b em { font-style: normal; font-size: 12px; font-weight: 800; }
.funnel > div { display: grid; grid-template-columns: 120px 1fr 30px; gap: 10px; align-items: center; font-size: 12.5px; margin-bottom: 9px; }
.rank { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #ffffff10; }
.dash { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }

/* ---------------- tabelas */
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 13px; }
.tbl th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); padding: 4px 12px; font-weight: 700; }
.tbl td { padding: 11px 12px; background: rgba(30, 42, 140, .38); }
.tbl td:first-child { border-radius: 10px 0 0 10px; } .tbl td:last-child { border-radius: 0 10px 10px 0; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: rgba(60, 72, 190, .5); }

/* ---------------- kanban */
.kanban { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.kcol { background: rgba(14, 20, 80, .55); border: 1px solid var(--line); border-radius: 16px; padding: 10px; min-height: 300px; transition: background .2s, border-color .2s; }
.kcol.over { background: rgba(80, 70, 220, .3); border-color: var(--vi); }
.kcol-h { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; margin: 2px 4px 10px; }
.kcard { background: linear-gradient(180deg, rgba(50, 64, 190, .55), rgba(30, 40, 140, .55)); border: 1px solid var(--line2); border-radius: 12px; padding: 10px; margin-bottom: 8px; cursor: grab; font-size: 12px; }
.kcard:active { cursor: grabbing; } .kcard.drag { opacity: .4; }
.kcard b { font-size: 13px; display: block; }

/* ---------------- portaria */
.hero { position: relative; border-radius: 22px; overflow: hidden; padding: 24px; background: radial-gradient(600px 300px at 70% 30%, #9b5cff88, transparent), linear-gradient(120deg, #3b2bd8, #2a37c8 50%, #4a2fd0); border: 1px solid #a99dff55; box-shadow: 0 30px 60px -30px #6a5bff; }
.hero .big { font-size: 64px; font-weight: 900; font-family: 'Plus Jakarta Sans'; line-height: 1; }
.cube3d { position: absolute; right: 18%; top: 28px; width: 110px; height: 110px; perspective: 600px; }
.cube3d .c { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: cube 9s linear infinite; }
.cube3d .f { position: absolute; inset: 0; background: linear-gradient(145deg, #f3c47a, #c98b3f); border: 1px solid #00000022; box-shadow: inset 0 0 30px #7a4a1866; }
.cube3d .f::after { content: ''; position: absolute; left: 44%; width: 12%; top: 0; bottom: 0; background: #e8d3a8cc; }
.cube3d .f1 { transform: translateZ(55px); } .cube3d .f2 { transform: rotateY(180deg) translateZ(55px); } .cube3d .f3 { transform: rotateY(90deg) translateZ(55px); }
.cube3d .f4 { transform: rotateY(-90deg) translateZ(55px); } .cube3d .f5 { transform: rotateX(90deg) translateZ(55px); } .cube3d .f6 { transform: rotateX(-90deg) translateZ(55px); }
@keyframes cube { from { transform: rotateX(-22deg) rotateY(0); } to { transform: rotateX(-22deg) rotateY(360deg); } }

/* ==========================================================================
   Prisma · Espelho de Vendas — FX (SITE / FVS VISÃO)
   Botões 3D interativos, cards com tilt, reveal no scroll, parallax,
   barra de progresso de scroll e scrollbars do tema.
   Regras: só transform / translate / box-shadow / background / filhos
   absolutos (.fx-skin). Nada altera width/height/display dos elementos.
   Carregue DEPOIS do CSS principal para que a "pele 3D" prevaleça.
   ========================================================================== */

:root {
  --fx-violet: #7b6cff;
  --fx-violet-2: #5b4bff;
  --fx-blue: #4fc3ff;
  --fx-green: #2fe07a;
  --fx-yellow: #ffc23a;
  --fx-red: #ff3b3b;
  --fx-ink: #070b26;
  --fx-ease: cubic-bezier(.2, .8, .2, 1);
  --fx-ease-out: cubic-bezier(.16, 1, .3, 1);
}

/* --------------------------------------------------------------------------
   1. BOTÕES 3D — base comum
   -------------------------------------------------------------------------- */

/* especificidade zero: se o seu CSS posicionar (absolute/fixed), ele vence */
:where(.btn, .chip, .seg > button, .tool, .nav-item, .icon-btn) {
  position: relative;
}

.btn, .chip, .seg > button, .tool, .nav-item, .icon-btn {
  --fx-depth: 4px;            /* altura da "tecla" */
  --fx-lift: 0px;             /* sobe no hover */
  --fx-press: 0px;            /* afunda ao pressionar */
  --fx-rx: 0deg;              /* tilt (JS) */
  --fx-ry: 0deg;
  --fx-scale: 1;
  --fx-persp: 520px;
  --fx-edge: rgba(3, 5, 22, .9);          /* cor da borda inferior */
  --fx-hi: rgba(255, 255, 255, .20);      /* aresta superior especular */
  --fx-ring: rgba(255, 255, 255, .07);    /* contorno (inset, não muda tamanho) */
  --fx-glow: rgba(123, 108, 255, 0);      /* halo colorido */
  --fx-drop: rgba(0, 0, 0, .55);

  transform:
    perspective(var(--fx-persp))
    translate3d(0, calc(var(--fx-lift) + var(--fx-press)), 0)
    rotateX(var(--fx-rx))
    rotateY(var(--fx-ry))
    scale(var(--fx-scale));
  box-shadow:
    inset 0 1px 0 var(--fx-hi),
    inset 0 -2px 0 rgba(0, 0, 0, .28),
    inset 0 0 0 1px var(--fx-ring),
    0 calc(var(--fx-depth) - var(--fx-press)) 0 var(--fx-edge),
    0 calc(var(--fx-depth) * 2 + 6px - var(--fx-press) * 2) 18px -8px var(--fx-drop),
    0 0 24px -6px var(--fx-glow);
  transition:
    transform .2s var(--fx-ease),
    box-shadow .2s var(--fx-ease),
    background-color .2s ease,
    color .2s ease,
    filter .2s ease;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  backface-visibility: hidden;
}

/* hover (classe aplicada pelo JS, funciona também com toque) */
.btn.fx-hover, .chip.fx-hover, .seg > button.fx-hover, .tool.fx-hover,
.nav-item.fx-hover, .icon-btn.fx-hover {
  --fx-lift: -1px;
  --fx-depth: 5px;
  --fx-hi: rgba(255, 255, 255, .30);
  will-change: transform;
}

/* pressionado: afunda até sobrar 1px de borda */
.btn:active, .chip:active, .seg > button:active, .tool:active,
.nav-item:active, .icon-btn:active,
.btn.pressed, .chip.pressed, .seg > button.pressed, .tool.pressed,
.nav-item.pressed, .icon-btn.pressed {
  --fx-lift: 0px;
  --fx-press: calc(var(--fx-depth) - 1px);
  --fx-scale: .985;
  --fx-drop: rgba(0, 0, 0, .35);
  transition-duration: .08s;
}

/* foco acessível */
.btn:focus-visible, .chip:focus-visible, .seg > button:focus-visible,
.tool:focus-visible, .nav-item:focus-visible, .icon-btn:focus-visible {
  outline: 2px solid var(--fx-blue);
  outline-offset: 3px;
  --fx-glow: rgba(79, 195, 255, .55);
}

/* desabilitado: sem efeito */
.btn:disabled, .chip:disabled, .seg > button:disabled, .tool:disabled,
.nav-item:disabled, .icon-btn:disabled,
.btn[aria-disabled="true"], .chip[aria-disabled="true"], .tool[aria-disabled="true"],
.nav-item[aria-disabled="true"], .icon-btn[aria-disabled="true"] {
  --fx-lift: 0px !important;
  --fx-press: 0px !important;
  --fx-rx: 0deg !important;
  --fx-ry: 0deg !important;
  --fx-scale: 1 !important;
  --fx-depth: 2px;
  --fx-glow: transparent;
  filter: saturate(.35) brightness(.85);
  opacity: .55;
  cursor: not-allowed;
}
:disabled > .fx-skin, [aria-disabled="true"] > .fx-skin { display: none; }

/* --------------------------------------------------------------------------
   2. VARIANTES
   -------------------------------------------------------------------------- */

.btn.btn-primary {
  background: linear-gradient(180deg, #9a8dff 0%, var(--fx-violet) 45%, var(--fx-violet-2) 100%);
  color: #fff;
  --fx-edge: #3a2bb8;
  --fx-hi: rgba(255, 255, 255, .45);
  --fx-ring: rgba(255, 255, 255, .10);
  --fx-glow: rgba(123, 108, 255, .45);
}
.btn.btn-primary.fx-hover { --fx-glow: rgba(123, 108, 255, .75); }

.btn.btn-ghost {
  background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .03));
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  backdrop-filter: blur(12px) saturate(140%);
  --fx-edge: rgba(2, 4, 20, .75);
  --fx-ring: rgba(255, 255, 255, .16);
  --fx-hi: rgba(255, 255, 255, .25);
}
.btn.btn-ghost.fx-hover { --fx-ring: rgba(79, 195, 255, .45); --fx-glow: rgba(79, 195, 255, .35); }

.btn.btn-green {
  background: linear-gradient(180deg, #6cf3a3 0%, var(--fx-green) 45%, #16b85b 100%);
  color: #04210f;
  --fx-edge: #0b7a3b;
  --fx-hi: rgba(255, 255, 255, .5);
  --fx-glow: rgba(47, 224, 122, .4);
}
.btn.btn-green.fx-hover { --fx-glow: rgba(47, 224, 122, .7); }

.btn.btn-danger {
  background: linear-gradient(180deg, #ff7a7a 0%, var(--fx-red) 45%, #d81f2b 100%);
  color: #fff;
  --fx-edge: #8a0f17;
  --fx-hi: rgba(255, 255, 255, .42);
  --fx-glow: rgba(255, 59, 59, .4);
}
.btn.btn-danger.fx-hover { --fx-glow: rgba(255, 59, 59, .7); }

.btn.btn-sm { --fx-depth: 3px; --fx-persp: 420px; }
.btn.btn-sm.fx-hover { --fx-depth: 4px; }
.btn.btn-block { --fx-persp: 900px; }

/* chips de filtro */
.chip { --fx-depth: 2px; --fx-ring: rgba(255, 255, 255, .12); }
.chip.fx-hover { --fx-depth: 3px; }
.chip.on {
  background: linear-gradient(180deg, rgba(154, 141, 255, .95), rgba(91, 75, 255, .95));
  color: #fff;
  --fx-depth: 3px;
  --fx-edge: #3a2bb8;
  --fx-hi: rgba(255, 255, 255, .45);
  --fx-glow: rgba(123, 108, 255, .55);
}

/* grupo segmentado: bandeja afundada, botão ativo saltado */
.seg {
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, .45), inset 0 -1px 0 rgba(255, 255, 255, .06);
}
.seg > button { --fx-depth: 0px; --fx-hi: rgba(255, 255, 255, 0); --fx-ring: transparent; --fx-drop: transparent; }
.seg > button.fx-hover { --fx-depth: 1px; --fx-hi: rgba(255, 255, 255, .12); }
.seg > button.on {
  background: linear-gradient(180deg, rgba(154, 141, 255, .9), rgba(91, 75, 255, .9));
  color: #fff;
  --fx-depth: 3px;
  --fx-edge: #3a2bb8;
  --fx-hi: rgba(255, 255, 255, .45);
  --fx-drop: rgba(0, 0, 0, .5);
  --fx-glow: rgba(123, 108, 255, .45);
}

/* toolbar flutuante sobre o 3D */
.tool {
  --fx-depth: 4px;
  --fx-persp: 300px;
  --fx-ring: rgba(255, 255, 255, .14);
}
.tool.on {
  --fx-ring: rgba(79, 195, 255, .7);
  --fx-glow: rgba(79, 195, 255, .6);
  --fx-edge: #0d4f7a;
}

/* sidebar: plano em repouso, ganha volume no hover / ativo */
.nav-item { --fx-depth: 0px; --fx-hi: transparent; --fx-ring: transparent; --fx-drop: transparent; --fx-persp: 380px; }
.nav-item.fx-hover {
  --fx-depth: 3px;
  --fx-hi: rgba(255, 255, 255, .2);
  --fx-ring: rgba(255, 255, 255, .08);
  --fx-drop: rgba(0, 0, 0, .5);
}
.nav-item.on {
  --fx-depth: 3px;
  --fx-edge: #2c1f9a;
  --fx-hi: rgba(255, 255, 255, .3);
  --fx-ring: rgba(123, 108, 255, .55);
  --fx-drop: rgba(0, 0, 0, .55);
  --fx-glow: rgba(123, 108, 255, .55);
}

.icon-btn { --fx-depth: 3px; --fx-persp: 280px; }
.icon-btn.fx-hover { --fx-depth: 4px; --fx-glow: rgba(79, 195, 255, .35); }

/* --------------------------------------------------------------------------
   3. PELE ESPECULAR (.fx-skin injetado pelo JS) + RIPPLE
   -------------------------------------------------------------------------- */

.fx-skin {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
  contain: strict;
}
/* verniz fixo de tecla (luz de cima) */
.fx-skin::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255, 255, 255, .13) 0%, rgba(255, 255, 255, 0) 52%);
}
/* brilho especular que segue o ponteiro (--mx / --my definidos pelo JS) */
.fx-skin::before {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  background: radial-gradient(
    circle at var(--mx, 50%) var(--my, 0%),
    rgba(255, 255, 255, .38) 0%,
    rgba(255, 255, 255, .10) 28%,
    rgba(255, 255, 255, 0) 60%
  );
  mix-blend-mode: screen;
  opacity: 0;
  transition: opacity .25s ease;
}
.fx-hover > .fx-skin::before,
.pressed > .fx-skin::before,
:focus-visible > .fx-skin::before { opacity: 1; }

.nav-item:not(.fx-hover):not(.on) > .fx-skin::after,
.seg > button:not(.on):not(.fx-hover) > .fx-skin::after { opacity: 0; }

.fx-ripple {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255, 255, 255, .55) 0%, rgba(190, 220, 255, .22) 38%, rgba(255, 255, 255, 0) 70%);
  mix-blend-mode: screen;
  transform: scale(0);
  opacity: 1;
  animation: fx-ripple .65s var(--fx-ease-out) forwards;
}
@keyframes fx-ripple {
  to { transform: scale(1); opacity: 0; }
}

/* --------------------------------------------------------------------------
   4. CARDS / KPIs — tilt sutil + brilho
   -------------------------------------------------------------------------- */

:where(.card, .kpi) { position: relative; }

.card, .kpi {
  --fx-rx: 0deg;
  --fx-ry: 0deg;
  transform: perspective(1100px) rotateX(var(--fx-rx)) rotateY(var(--fx-ry)) translateZ(0);
  transition: transform .45s var(--fx-ease);
}
.card.fx-hover, .kpi.fx-hover { transition-duration: .15s; will-change: transform; }

.card > .fx-skin::after, .kpi > .fx-skin::after {
  background: none;
  box-shadow: inset 0 0 0 1px rgba(123, 108, 255, 0);
  transition: box-shadow .3s ease;
}
.card.fx-hover > .fx-skin::after, .kpi.fx-hover > .fx-skin::after {
  box-shadow: inset 0 0 0 1px rgba(123, 108, 255, .35), inset 0 1px 0 rgba(255, 255, 255, .12);
}
.card > .fx-skin::before, .kpi > .fx-skin::before {
  background: radial-gradient(
    600px circle at var(--mx, 50%) var(--my, 0%),
    rgba(123, 108, 255, .16) 0%,
    rgba(79, 195, 255, .06) 30%,
    rgba(255, 255, 255, 0) 60%
  );
}

/* --------------------------------------------------------------------------
   5. SCROLL — scrollbars, progresso, reveal, parallax
   -------------------------------------------------------------------------- */

.view, .panel-scroll {
  scrollbar-width: thin;
  scrollbar-color: rgba(123, 108, 255, .55) transparent;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
:where(.view) { position: relative; } /* ancora a barra de progresso */

.view::-webkit-scrollbar, .panel-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.view::-webkit-scrollbar-track, .panel-scroll::-webkit-scrollbar-track { background: transparent; }
.view::-webkit-scrollbar-thumb, .panel-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--fx-violet), var(--fx-blue));
  border: 2px solid transparent;
  background-clip: padding-box;
  border-radius: 99px;
}
.view::-webkit-scrollbar-thumb:hover, .panel-scroll::-webkit-scrollbar-thumb:hover {
  border-width: 1px;
}

/* barra de progresso (criada pelo JS como último filho da .view) */
.fx-progress {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  z-index: 40;
  pointer-events: none;
  transition: opacity .3s ease;
  will-change: transform;
}
.fx-progress > i {
  display: block;
  height: 100%;
  transform-origin: 0 50%;
  transform: scaleX(0);
  background: linear-gradient(90deg, var(--fx-violet), var(--fx-blue) 60%, var(--fx-green));
  box-shadow: 0 0 10px rgba(79, 195, 255, .7), 0 0 2px rgba(255, 255, 255, .6);
  border-radius: 0 2px 2px 0;
}
.fx-progress.is-empty { opacity: 0; }

/* reveal: só esconde quando o JS está ativo (html.fx-ready) */
html.fx-ready [data-reveal]:not(.fx-in) {
  opacity: 0;
  translate: 0 28px;
}
html.fx-ready [data-reveal="left"]:not(.fx-in)  { translate: -40px 0; }
html.fx-ready [data-reveal="right"]:not(.fx-in) { translate: 40px 0; }
html.fx-ready [data-reveal="zoom"]:not(.fx-in)  { translate: 0 0; scale: .92; }

[data-reveal].fx-in { opacity: 1; translate: none; scale: none; }

[data-reveal].fx-anim {
  transition:
    opacity .7s ease var(--fx-delay, 0ms),
    translate .9s var(--fx-ease-out) var(--fx-delay, 0ms),
    scale .9s var(--fx-ease-out) var(--fx-delay, 0ms),
    transform .45s var(--fx-ease),
    box-shadow .2s var(--fx-ease);
}

[data-parallax], [data-depth] { will-change: translate; }

/* utilitário opcional: esmaece topo/rodapé de um container rolável */
.fx-fade-edges {
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
  mask-image: linear-gradient(180deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
